<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">奇点选择：迎角、弯度和厚度对应的奇点分布</title>
<desc id="desc">三幅严格区分的二维示意图。迎角平板和弯曲中弧线分别由涡片表示；零迎角对称厚度通过前部源、后部汇构造。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12232d"/><stop offset="1" stop-color="#0d1923"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8aa5b6"/></marker>
<marker id="mintarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#74ded0"/></marker>
<marker id="goldarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#efd08f"/></marker>
<style>
text{font-family:Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#dce9ec;font-size:15px}
.card{fill:url(#bg);stroke:#29414f;stroke-width:1.5}
.kicker{font-size:12px;letter-spacing:2px;fill:#83c9c6;font-weight:700}
.heading{font-size:20px;font-weight:700}
.muted{font-size:13px;fill:#a8bbc6}
.tag{font-size:14px;fill:#f1d699;font-weight:700}
.axis{stroke:#708b9c;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
.sheet{stroke:#77ddcf;stroke-width:4;stroke-linecap:round;fill:none}
.guide{stroke:#617b8c;stroke-width:1.1;fill:none;stroke-dasharray:5 6}
.vortex{fill:#10252d;stroke:#7cddd1;stroke-width:2}
</style>
</defs>
<rect x="1" y="1" width="1198" height="438" rx="17" fill="#0c1720" stroke="#263c4a"/>
<rect class="card" x="20" y="20" width="374" height="400" rx="12"/>
<rect class="card" x="413" y="20" width="374" height="400" rx="12"/>
<rect class="card" x="806" y="20" width="374" height="400" rx="12"/>
<!-- 1: incidence -->
<text x="42" y="54" class="kicker">01 / INCIDENCE</text><text x="42" y="86" class="heading">平板 + 迎角 α</text>
<path class="axis" d="M52 175 H179"/><text x="83" y="163" class="muted">U∞</text>
<path class="guide" d="M65 280 H350"/><text x="320" y="297" class="muted">弦线参照</text>
<path class="sheet" d="M75 280 L343 208"/>
<path d="M75 280 L166 280 A91 91 0 0 0 163 256" fill="none" stroke="#f1d699" stroke-width="1.7"/>
<text x="163" y="276" class="tag">α</text>
<circle class="vortex" cx="122" cy="267" r="9"/><circle class="vortex" cx="188" cy="250" r="9"/><circle class="vortex" cx="254" cy="232" r="9"/>
<path d="M119 263 Q128 263 126 270" fill="none" stroke="#7cddd1" stroke-width="1.5" marker-end="url(#mintarrow)"/>
<path d="M185 246 Q194 246 192 253" fill="none" stroke="#7cddd1" stroke-width="1.5" marker-end="url(#mintarrow)"/>
<path d="M251 228 Q260 228 258 235" fill="none" stroke="#7cddd1" stroke-width="1.5" marker-end="url(#mintarrow)"/>
<text x="42" y="353" class="tag">γ₁(x) · 涡片</text><text x="42" y="379" class="muted">表面切向速度差 → 环量与升力</text>
<!-- 2: camber -->
<text x="435" y="54" class="kicker">02 / CAMBER</text><text x="435" y="86" class="heading">弯板 + 零迎角</text>
<path class="axis" d="M439 175 H558"/><text x="466" y="163" class="muted">U∞</text>
<path class="guide" d="M444 280 H757"/>
<path class="sheet" d="M458 280 Q600 144 746 280"/>
<path d="M582 214 L643 178" fill="none" stroke="#f1d699" stroke-width="1.4"/><text x="652" y="188" class="muted">局部切线</text>
<circle class="vortex" cx="507" cy="243" r="9"/><circle class="vortex" cx="603" cy="212" r="9"/><circle class="vortex" cx="700" cy="242" r="9"/>
<path d="M503 240 Q513 240 511 247 M599 209 Q609 209 607 216 M696 239 Q706 239 704 246" fill="none" stroke="#7cddd1" stroke-width="1.4" marker-end="url(#mintarrow)"/>
<text x="435" y="353" class="tag">γ₂(x) · 涡片</text><text x="435" y="379" class="muted">中弧线斜率 → 非对称切向速度</text>
<!-- 3: thickness -->
<text x="828" y="54" class="kicker">03 / THICKNESS</text><text x="828" y="86" class="heading">对称厚翼 + 零迎角</text>
<path class="axis" d="M831 175 H928"/><text x="857" y="163" class="muted">U∞</text>
<path d="M845 255 C906 191 1026 204 1150 255 C1026 306 906 319 845 255 Z" fill="#183840" stroke="#78d8cb" stroke-width="2.3"/>
<path class="guide" d="M839 255 H1160"/>
<path d="M921 256 V206" stroke="#f1d699" stroke-width="1.4"/><text x="927" y="219" class="muted">yₛ</text>
<circle cx="902" cy="255" r="6" fill="#77dfd0"/><circle cx="954" cy="255" r="6" fill="#77dfd0"/>
<circle cx="1063" cy="255" r="6" fill="#f1d699"/><circle cx="1107" cy="255" r="6" fill="#f1d699"/>
<path d="M924 219 V178 M924 291 V333" stroke="#74ded0" stroke-width="2" fill="none" marker-end="url(#mintarrow)"/>
<path d="M1090 173 V211 M1090 338 V300" stroke="#efd08f" stroke-width="2" fill="none" marker-end="url(#goldarrow)"/>
<text x="886" y="355" class="muted">q &gt; 0</text><text x="1070" y="355" class="muted">q &lt; 0</text>
<text x="828" y="386" class="tag">q(x) · 源片 / 汇片</text>
<text x="828" y="407" class="muted">法向速度跳跃，闭合翼型净源强为零</text>
</svg>