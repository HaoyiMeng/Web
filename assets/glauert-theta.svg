<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
<title id="title">Glauert 角坐标变换：半圆点投影到翼弦</title>
<desc id="description">θ 从零到 π，半圆以弦长 c/2 为半径，水平投影是 x = c/2(1−cos θ)。标注 θ=60° 时 x=c/4，并展示前缘与后缘更密集的非线性投影。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#8ca4b2"/></marker>
<linearGradient id="semi" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#183c46" stop-opacity=".75"/><stop offset="1" stop-color="#10232d" stop-opacity=".1"/></linearGradient>
<style>text{font-family:Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#dae9ee;font-size:15px}.small{font-size:13px;fill:#acc1cb}.tiny{font-size:12px;fill:#8ea8b5}.accent{fill:#7cddcf}.gold{fill:#f0d18c}.axis{stroke:#75909f;stroke-width:1.8}.dash{stroke:#557481;stroke-dasharray:5 7;stroke-width:1.2;fill:none}</style></defs>
<rect x="1" y="1" width="958" height="478" rx="16" fill="#0c1720" stroke="#2d4958"/>
<text x="35" y="43" style="font-size:12px;fill:#7cddcf;letter-spacing:2px;font-weight:700">CHORDWISE COORDINATE MAPPING</text>
<text x="35" y="75" style="font-size:21px;font-weight:700">半圆角坐标 θ 与翼弦位置 x</text>
<text x="925" y="76" text-anchor="end" class="small">x(θ) = c/2 · (1 − cos θ)</text>
<!-- exact radius 220 around C(480,300) -->
<path d="M260 300 A220 220 0 0 1 700 300 L260 300 Z" fill="url(#semi)"/>
<path d="M260 300 A220 220 0 0 1 700 300" stroke="#6ed6cc" fill="none" stroke-width="3"/>
<line x1="216" y1="300" x2="742" y2="300" class="axis" marker-end="url(#arrow)"/>
<text x="744" y="307" class="small">x</text>
<line x1="480" y1="300" x2="370" y2="109.474" stroke="#f1d08e" stroke-width="2.6"/>
<line x1="370" y1="109.474" x2="370" y2="300" class="dash"/>
<path d="M426 300 A54 54 0 0 1 453 253.234" fill="none" stroke="#f1d08e" stroke-width="2.2"/>
<text x="422" y="246" class="gold">θ</text>
<circle cx="370" cy="109.474" r="7" fill="#f1d08e" stroke="#192832" stroke-width="3"/>
<circle cx="370" cy="300" r="5" fill="#f1d08e"/>
<line x1="370" y1="300" x2="370" y2="339" stroke="#f1d08e" stroke-width="1.6"/>
<text x="370" y="359" text-anchor="middle" class="gold">x = c/4</text>
<text x="376" y="98" class="gold">θ = 60°</text>
<text x="488" y="289" class="small">O</text>
<text x="260" y="285" text-anchor="middle" class="accent">LE</text>
<text x="700" y="285" text-anchor="middle" class="accent">TE</text>
<text x="260" y="333" text-anchor="middle" class="small">x = 0</text>
<text x="480" y="333" text-anchor="middle" class="small">x = c/2</text>
<text x="700" y="333" text-anchor="middle" class="small">x = c</text>
<!-- five angle ticks and coordinate positions on a separate chord rule -->
<line x1="260" y1="394" x2="700" y2="394" stroke="#405969" stroke-width="2"/>
<g stroke="#6dd1c5" fill="#6dd1c5"><circle cx="260" cy="394" r="4"/><circle cx="324.437" cy="394" r="4"/><circle cx="480" cy="394" r="4"/><circle cx="635.563" cy="394" r="4"/><circle cx="700" cy="394" r="4"/></g>
<g class="tiny" text-anchor="middle"><text x="260" y="418">0°</text><text x="324.437" y="418">45°</text><text x="480" y="418">90°</text><text x="635.563" y="418">135°</text><text x="700" y="418">180°</text></g>
<text x="480" y="450" text-anchor="middle" class="small">θ 均匀变化并不对应 x 均匀变化：靠近前缘与后缘的弦向位置更密集</text>
</svg>